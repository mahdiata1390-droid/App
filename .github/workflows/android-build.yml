name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK
        run: |
          echo "Release APK files:"
          find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print -quit)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: game-booster-release-1.0.0
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
