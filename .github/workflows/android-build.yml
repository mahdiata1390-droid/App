name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Android XML resources
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          files = list(pathlib.Path("app/src/main").rglob("*.xml"))
          for path in files:
              ET.parse(path)
              print(f"OK XML: {path}")
          print(f"Validated {len(files)} XML files.")
          PY

      - name: Run JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon lintRelease

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify signed release APK
        run: |
          set -e
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print -quit)"
          test -n "$APK"
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "Signed APK verification passed."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: game-booster-release-2.0.0
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
