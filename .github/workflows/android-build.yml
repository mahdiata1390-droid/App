name: Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore release keystore from secret
        if: ${{ secrets.GB_KEYSTORE_BASE64 != '' }}
        env:
          GB_KEYSTORE_BASE64: ${{ secrets.GB_KEYSTORE_BASE64 }}
        run: printf '%s' "$GB_KEYSTORE_BASE64" | base64 -d > app/gamebooster-release.jks

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Android XML resources
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          files = list(pathlib.Path("app/src/main").rglob("*.xml"))
          for path in files:
              ET.parse(path)
          print(f"Validated {len(files)} XML files.")
          PY

      - name: Run JVM unit tests
        run: |
          gradle --no-daemon --console=plain testDebugUnitTest > /tmp/test.log 2>&1 || {
            echo "unit tests failed";
            grep -nE "FAILED|error:|e: " /tmp/test.log | head -40;
            tail -40 /tmp/test.log;
            exit 1;
          }
          echo "unit tests passed"

      - name: Run Android lint
        run: |
          set +e
          gradle --no-daemon --console=plain lintRelease > /tmp/lint.log 2>&1
          status=$?
          echo "lint exit: $status"
          if [ "$status" -ne 0 ]; then
            echo "--- lint totals ---"
            grep -E "^[0-9]+ errors?" app/build/reports/lint-results-release.txt | tail -3
            echo "--- lint errors ---"
            grep -E ": Error: " app/build/reports/lint-results-release.txt | head -40 \
              || grep -nE "Error:|error:" /tmp/lint.log | head -40
          fi
          exit $status

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify signed release APK
        run: |
          set -e
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" -print -quit)"
          test -n "$APK"
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "Signed APK verification passed."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: game-booster-release-2.2.1
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
