plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.codleander.gamebooster'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codleander.gamebooster'
        minSdk 26
        targetSdk 35
        versionCode 210
        versionName '2.1.0'
    }

    signingConfigs {
        release {
            storeFile file("gamebooster-release.jks")
            storePassword "GB-Release-2026!StormKey"
            keyAlias "gamebooster"
            keyPassword "GB-Release-2026!StormKey"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.tracing:tracing-ktx:2.0.5'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.0.21'
}
