plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing material comes from the environment when it is provided (CI secrets / a local
// shell), so the key can be rotated without editing sources. The fallback keeps the
// repository's own keystore working; see RELEASE.md for rotation steps.
def releaseKeystorePath = System.getenv('GB_KEYSTORE_PATH') ?: 'gamebooster-release.jks'
def releaseStorePassword = System.getenv('GB_STORE_PASSWORD') ?: 'GB-Release-2026!StormKey'
def releaseKeyAlias = System.getenv('GB_KEY_ALIAS') ?: 'gamebooster'
def releaseKeyPassword = System.getenv('GB_KEY_PASSWORD') ?: releaseStorePassword

android {
    namespace 'com.codleander.gamebooster'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codleander.gamebooster'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    signingConfigs {
        release {
            storeFile file(releaseKeystorePath)
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // Obfuscation + shrinking: class/member names and unused code are removed so the
            // shipped APK cannot be read back as readable source.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.tracing:tracing-ktx:2.0.5'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:2.0.21'
}
